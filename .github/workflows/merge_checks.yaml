name: Pre-Merge Checks

on:
  # Trigger the workflow when a PR is opened/updated against the default or
  # any stable release branch.
  pull_request:
    branches:
    - main
    - '*-stable'
  # Trigger the workflow when commits are pushed to a stable release branch. 
  # Because they are protected branches this workflow is effectively triggered 
  # by three events:
  # 1. When a stable release branch is initially created/pushed.
  # 2. When a PR against the default or any stable release branch is opened/updated.
  # 3. When a PR against the default or any stable release branch is merged.
  push:
    branches:
    - main
    - '*-stable'
  # Allow the workflow to be triggered manually.
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "Pre-Merge Checks ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  check-package:
    # Override the default job name to differentiate it from similar jobs in 
    # other workflows.
    name: "check-package (r2u)"

    # Use the `satijalab/seurat-ci` Docker image as the runner environment. 
    # This image is pre-configured with everything required for running
    # integration checks, for more details, see
    # https://hub.docker.com/repository/docker/satijalab/seurat-ci/general.
    runs-on: ubuntu-latest
    container:
      image: satijalab/seurat-ci:latest

    steps:
      # Pull the latest changes from the repository down to the runner.
      - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
        shell: sh
        run: |
          command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
          elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
          elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
          elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
          elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
          fi

      - name: Checkout
        uses: crashappsec/action-checkout@main
      
      # Install the package and all its dependencies using pak
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Install Dependencies
        run: Rscript -e 'options(repos = c(CRAN = Sys.getenv("RSPM"))); Sys.setenv(PAK_PPM_URL = Sys.getenv("RSPM")); pak::local_install(dependencies = TRUE)'
        
      # Install SeuratObject from CRAN
      # This helps check updates to SeuratObject and Seurat in rapid succession
      - name: Install SeuratObject from CRAN (source)
        run: Rscript -e "install.packages('SeuratObject', type = 'source', repos = 'https://cloud.r-project.org')"

      # Run CRAN checks, if any ERRORs or WARNINGs are raised the check fails.
      # Certain tests are skipped when running as CRAN—skip all tests so they
      # can be run together in a subsequent step.
      - name: Run CRAN Checks (no tests)
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--as-cran", "--no-tests"), 
            error_on="warning"
          )
        shell: Rscript {0}

      # Because tests weren't included in CRAN checks, run them here.
      - name: Run Tests
        # Run this step even if the previous one failed.
        if: always()
        run: testthat::test_local()
        shell: Rscript {0}
